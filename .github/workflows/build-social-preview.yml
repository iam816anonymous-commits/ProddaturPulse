name: Generate social preview PNG
on:
  workflow_dispatch:
  push:
    paths:
      - "social-preview.svg"
      - ".github/workflows/build-social-preview.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cairosvg
      - name: Render 1200x630 PNG
        run: python -c "import cairosvg; cairosvg.svg2png(url='social-preview.svg', write_to='social-preview.png', output_width=1200, output_height=630)"
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.png
          git diff --cached --quiet || (git commit -m "[skip ci] Generate social preview PNG" && git push)
